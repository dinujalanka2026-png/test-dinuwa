<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }

        h1 {
            margin: 0;
            font-size: 40px;
        }

        p {
            font-size: 18px;
        }

        .container {
            margin-top: 100px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #333;
            color: white;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<header>
    <h1>My Website 🚀</h1>
</header>

<div class="container">
    <h2>Welcome!</h2>
    <p>This is my first beautiful website 😎</p>
    <button onclick="showMessage()">Click Me</button>
</div>

<footer>
    <p>© 2026 My Website</p>
</footer>

<script>
    function showMessage() {
        alert("Hello! You clicked the button 🎉");
    }
</script>

</body>
</html>
